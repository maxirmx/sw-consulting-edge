server_tokens off;

# Resolve application aliases at request time. This keeps the edge healthy when
# either independently deployed application is stopped or moved elsewhere.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name klinok.sw.consulting;

    return 301 https://klinok.sw.consulting$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sarafan.sw.consulting;

    return 301 https://sarafan.sw.consulting$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certificate/s.crt;
    ssl_certificate_key /etc/nginx/certificate/s.key;

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name klinok.sw.consulting;

    ssl_certificate /etc/nginx/certificate/s.crt;
    ssl_certificate_key /etc/nginx/certificate/s.key;

    set $application_upstream klinok-ui:8080;

    location / {
        proxy_pass http://$application_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sarafan.sw.consulting;

    ssl_certificate /etc/nginx/certificate/s.crt;
    ssl_certificate_key /etc/nginx/certificate/s.key;

    set $application_upstream sarafan-ui:8080;

    location / {
        proxy_pass http://$application_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
